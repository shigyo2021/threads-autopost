name: Process Scheduled Posts

on:
  schedule:
    # 15分ごと。混雑する毎時0分・30分は避ける（GitHubの定時実行は数分〜数十分遅れることがある）
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:
    inputs:
      check_token:
        description: '投稿せずに、登録したThreadsトークンが使えるかだけ確認する'
        type: boolean
        default: false

# リポジトリへの書き込み（キューの状態更新）以外の権限は与えない
permissions:
  contents: write

# 同時に2つ動いて二重投稿しないように
concurrency:
  group: scheduled-posts
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # 手動実行で check_token にチェックを入れたときだけ。投稿はしない
      - name: Set up Python for token check
        if: github.event_name == 'workflow_dispatch' && inputs.check_token
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'

      - name: Check Threads token (manual only)
        if: github.event_name == 'workflow_dispatch' && inputs.check_token
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: |
          pip install --quiet requests python-dotenv
          python process_queue.py --check-token

      # 標準ライブラリだけで判定する（ライブラリのインストールもシークレットの受け渡しもしない）
      - name: Check due posts
        id: check
        run: python3 process_queue.py --check

      - name: Set up Python
        if: steps.check.outputs.due != '0'
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.check.outputs.due != '0'
        run: pip install requests python-dotenv

      # シークレットはこのステップだけに渡す。公開ログに出る値は GitHub が伏せ字にし、
      # さらに process_queue.py 側でもトークンらしき文字列を伏せ字にしている
      - name: Post due entries
        if: steps.check.outputs.due != '0'
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python process_queue.py

      - name: Save queue status
        if: always() && steps.check.outputs.due != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/queue
          if git diff --staged --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "Update scheduled post status [bot]"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
